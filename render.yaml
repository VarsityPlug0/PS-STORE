databases:
  - name: ps-store-db
    plan: free
    databaseName: ps_store
    user: ps_store

services:
  - type: web
    name: ps-store
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && node scripts/migrate.mjs && node scripts/seed.mjs
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ps-store-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
